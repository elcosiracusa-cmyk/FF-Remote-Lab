name: FFRemoteLab
options:
  bundleIdPrefix: it.fflab
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  FFRemoteLab:
    type: application
    platform: iOS
    sources:
      - path: FFRemoteLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.fflab.remoteios
        CODE_SIGN_ENTITLEMENTS: FFRemoteLab/FFRemoteLab.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: FFBroadcastExtension
        embed: true
  FFBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: FFBroadcastExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.fflab.remoteios.broadcast
        CODE_SIGN_ENTITLEMENTS: FFBroadcastExtension/FFBroadcastExtension.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.broadcast-services-upload
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
